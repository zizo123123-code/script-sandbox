# ============================================================
# AGENTS.yaml — المصدر الوحيد للحقيقة عن الأيجنتات
# Protocol-Version مرجعه: .connect/PROTOCOL.md
# لا تعدل هذا الملف يدوياً — استخدم: python .connect/tools/new_agent.py
# ============================================================
schema_version: "1.0"
protocol_version: "1.0"

# نمط تسمية السكربتات الإلزامي (داخل projects/{slug}/scripts/)
naming_pattern: "{NN.NN}_{CODE}_{slug}.py"
naming_rules:
  - "NN.NN = رقم الإصدار (استخدم next_version.py لحسابه)"
  - "CODE = اختصار الأيجنت من هذا الملف (حروف كبيرة)"
  - "slug = وصف قصير بالإنجليزية snake_case"
  - "أول سطر في أي سكربت جديد: # Based-on: <اسم الملف الأصل أو NONE>"

